name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No dataset download, no model, no GPU. Tests that need the fetched corpus skip
    # when it is absent, so this runs the logic tests only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff==0.16.7
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
